server.port=8080
server.servlet.context-path=/ShoppingAdmin

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/shopping
spring.datasource.username=root
spring.datasource.password=
spring.datasource.drives-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

# Enable version-agnostic WebJar access
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/webjars/**

spring.thymeleaf.cache=false
