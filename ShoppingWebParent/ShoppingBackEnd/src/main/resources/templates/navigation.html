<div th:fragment="menu">
	<form th:action="@{/logout}" method="post" th:hidden="true" id="logoutForm" name="logoutForm">
		<input type="submit" />
	</form>
	<nav class="navbar navbar-expand-lg bg-dark navbar-dark">
		<a class="navbar-brand" th:href="@{/}">
			<img th:src="@{/images/ShopmeAdminSmall.png}" alt=""/>
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNavbar">
			<span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="topNavbar">
			<ul class="navbar-nav">

				<!-- Admin-only menus -->
				<li class="nav-item dropdown" sec:authorize="hasAuthority('Admin')">
					<a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" th:href="@{/users}">Users</a>
					<div class="dropdown-menu">
						<a class="dropdown-item" th:href="@{/users/new}">Create New</a>
						<a class="dropdown-item" th:href="@{/users}">View All</a>
					</div>
				</li>

				<li class="nav-item dropdown" sec:authorize="hasAnyAuthority('Admin', 'Editor')">
					<a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" th:href="@{/categories}">Categories</a>
					<div class="dropdown-menu">
						<a class="dropdown-item" th:href="@{/categories/new}">Create New</a>
						<a class="dropdown-item" th:href="@{/categories}">View All</a>
					</div>
				</li>

				<li class="nav-item dropdown" sec:authorize="hasAnyAuthority('Admin', 'Editor')">
					<a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" th:href="@{/brands}">Brands</a>
					<div class="dropdown-menu">
						<a class="dropdown-item" th:href="@{/brands/new}">Create New</a>
						<a class="dropdown-item" th:href="@{/brands}">View All</a>
					</div>
				</li>

				<!-- Products (for all logged-in users) -->
				<li class="nav-item dropdown" sec:authorize="isAuthenticated()">
					<a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" th:href="@{/products}">Products</a>
					<div class="dropdown-menu">
						<a class="dropdown-item" th:href="@{/products/new}" sec:authorize="hasAnyAuthority('Admin', 'Editor')">Create New</a>
						<a class="dropdown-item" th:href="@{/products}">View All</a>
						<a class="dropdown-item" th:href="@{/reviews/public}">Reviews</a>
						<a class="dropdown-item" th:href="@{/reviews}" sec:authorize="hasAuthority('Admin')">Manage Reviews</a>
					</div>
				</li>

				<!-- ============ CART ICON (TOP-LEVEL) ============ -->
				<li class="nav-item" sec:authorize="hasAuthority('Customer')">
					<a class="nav-link position-relative" th:href="@{/cart}" style="padding-right: 0.5rem;">
						<i class="fas fa-shopping-cart fa-lg"></i>
						<!-- Optional badge: <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" th:text="${cartItemCount}">3</span> -->
					</a>
				</li>

				<!-- ============ USER ACCOUNT DROPDOWN ============ -->
				<li class="nav-item dropdown" sec:authorize="isAuthenticated()">
					<a class="nav-link dropdown-toggle d-flex align-items-center"
					   data-bs-toggle="dropdown" href="#" role="button">
						<i class="fas fa-user fa-lg me-1"></i>
						<span sec:authentication="principal.fullname"></span>
					</a>
					<ul class="dropdown-menu dropdown-menu-end">

						<!-- Customer-specific actions -->
						<li sec:authorize="hasAuthority('Customer')">
							<a class="dropdown-item" th:href="@{/cart}">
								<i class="fas fa-shopping-cart me-2"></i> My Cart
							</a>
						</li>
						<li sec:authorize="hasAuthority('Customer')">
							<a class="dropdown-item" th:href="@{/orders}">
								<i class="fas fa-box me-2"></i> My Orders
							</a>
						</li>
						<li sec:authorize="hasAuthority('Customer')">
							<a class="dropdown-item" th:href="@{/addresses#list}">
								<i class="fas fa-map-marker-alt me-2"></i> My Addresses
							</a>
						</li>
						<li sec:authorize="hasAuthority('Customer')">
							<a class="dropdown-item" th:href="@{/settings#payment}">
								<i class="fas fa-money-bill me-2"></i> Payment
							</a>
						</li>

						<!-- Divider -->
						<li><hr class="dropdown-divider"></li>

						<!-- Settings (visible to Customer or Admin) -->
						<li>
							<a class="dropdown-item" th:href="@{/shipping-rates}">
								<i class="fas fa-shipping-fast me-2"></i> Shipping Rates
							</a>
						</li>
						<li sec:authorize="hasAuthority('Admin')">
							<a class="dropdown-item" th:href="@{/settings#countries}">
								<i class="fas fa-globe me-2"></i> Countries
							</a>
						</li>
						<li sec:authorize="hasAuthority('Admin')">
							<a class="dropdown-item" th:href="@{/settings#states}">
								<i class="fas fa-flag me-2"></i> States
							</a>
						</li>

						<!-- Final divider before logout -->
						<li><hr class="dropdown-divider"></li>

						<!-- Logout -->
						<li>
							<a class="dropdown-item text-danger" href="#"
							   onclick="document.getElementById('logoutForm').submit(); return false;">
								<i class="fas fa-sign-out-alt me-2"></i> Logout
							</a>
						</li>
					</ul>
				</li>

			</ul>
		</div>
	</nav>
</div>
