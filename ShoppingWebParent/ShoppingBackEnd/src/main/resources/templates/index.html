<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="fragments :: page_head('Home - Shopme Admin', 'none')" />
<body>

<div th:if="${session.error}" class="alert alert-danger alert-dismissible fade show position-fixed top-0 end-0 m-3" role="alert" style="z-index: 9999;">
	<strong>⚠️ Access Denied!</strong> [[${session.error}]]
	<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div class="container-fluid">
	<div th:replace="navigation :: menu"></div>
	<div>
		<h2>Shopme Control Panel</h2>
		Welcome 
		<a th:href="@{/account}" 
			sec:authentication="principal.fullname"></a>	
		<span sec:authentication="principal.authorities"></span>		
	</div>

	<div th:replace="fragments :: footer"></div>
	
</div>
</body>
</html>
