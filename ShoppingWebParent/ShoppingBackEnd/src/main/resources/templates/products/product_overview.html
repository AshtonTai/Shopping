<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="~{fragments :: page_head('Products - Shopme Admin', 'none')}" />
<body>
<div th:fragment="content" th:remove="tag">
	<div class="row g-3">
		<!-- Product Name -->
		<div class="col-md-6">
			<label class="form-label fw-bold">Product Name *</label>
			<th:block th:if="${isReadOnlyForSalesperson}">
				<input type="text" class="form-control-plaintext fs-5"
					   th:value="*{name}" readonly />
			</th:block>
			<th:block th:unless="${isReadOnlyForSalesperson}">
				<input type="text" class="form-control" th:field="*{name}"
					   required minlength="3" maxlength="256"
					   placeholder="Enter product name" />
			</th:block>
		</div>

		<!-- Alias -->
		<div class="col-md-6">
			<label class="form-label fw-bold">Alias</label>
			<th:block th:if="${isReadOnlyForSalesperson}">
				<input type="text" class="form-control-plaintext"
					   th:value="*{alias}" readonly />
			</th:block>
			<th:block th:unless="${isReadOnlyForSalesperson}">
				<input type="text" class="form-control" th:field="*{alias}"
					   minlength="3" maxlength="256"
					   placeholder="URL-friendly name (auto-generated if empty)" />
			</th:block>
		</div>

		<!-- Brand -->
		<div class="col-md-6">
			<label class="form-label fw-bold">Brand *</label>
			<th:block th:if="${isReadOnlyForSalesperson}">
				<input type="text" class="form-control-plaintext"
					   th:value="${product.brand?.name ?: 'Not set'}" readonly />
			</th:block>
			<th:block th:unless="${isReadOnlyForSalesperson}">
				<select th:field="*{brand}" class="form-select" required>
					<option value="">── Select Brand ──</option>
					<option th:each="brand : ${listBrands}"
							th:value="${brand.id}"
							th:text="${brand.name}">Brand</option>
				</select>
			</th:block>
		</div>

		<!-- Category -->
		<div class="col-md-6">
			<label class="form-label fw-bold">Category *</label>
			<th:block th:if="${isReadOnlyForSalesperson}">
				<input type="text" class="form-control-plaintext"
					   th:value="${product.category?.name ?: 'Not set'}" readonly />
			</th:block>
			<th:block th:unless="${isReadOnlyForSalesperson}">
				<select th:field="*{category}" class="form-select" required>
					<option value="">── Select Category ──</option>
					<th:block th:if="${product.brand != null}">
						<option th:each="cat : ${product.brand.categories}"
								th:value="${cat.id}"
								th:text="${cat.name}">Category</option>
					</th:block>
				</select>
			</th:block>
		</div>

		<!-- Stock & Status -->
		<div class="col-md-4">
			<label class="form-label fw-bold">In Stock *</label>
			<th:block th:if="${isReadOnlyForSalesperson}">
				<input type="number" class="form-control-plaintext fs-4"
					   th:value="*{inStock}" readonly />
			</th:block>
			<th:block th:unless="${isReadOnlyForSalesperson}">
				<input type="number" class="form-control" th:field="*{inStock}"
					   required min="0" placeholder="0" />
			</th:block>
		</div>

		<div class="col-md-4">
			<label class="form-label fw-bold">Status</label>
			<div class="form-check form-switch">
				<th:block th:if="${isReadOnlyForSalesperson}">
					<input type="checkbox" class="form-check-input"
						   th:checked="*{enabled}" disabled />
				</th:block>
				<th:block th:unless="${isReadOnlyForSalesperson}">
					<input type="checkbox" class="form-check-input" th:field="*{enabled}"
						   id="enabledSwitch" />
				</th:block>
				<label class="form-check-label" for="enabledSwitch">
					<span th:if="*{enabled}">Enabled</span>
					<span th:unless="*{enabled}">Disabled</span>
				</label>
			</div>
		</div>

		<!-- Pricing Section -->
		<div class="col-12">
			<h5 class="border-bottom pb-2 mb-3">
				<i class="fas fa-tag me-2"></i>Pricing
			</h5>
		</div>

		<!-- Cost (Admin/Editor only) -->
		<div class="col-md-4" sec:authorize="hasAnyAuthority('Admin', 'Editor')">
			<label class="form-label fw-bold">Cost (MYR)</label>
			<div class="input-group">
				<span class="input-group-text">RM</span>
				<input type="number" step="0.01" class="form-control" th:field="*{cost}"
					   min="0" placeholder="0.00" />
			</div>
		</div>

		<!-- Price -->
		<div class="col-md-4">
			<label class="form-label fw-bold">Price (MYR) *</label>
			<div class="input-group">
				<span class="input-group-text">RM</span>
				<input type="number" step="0.01" class="form-control" th:field="*{price}"
					   min="0" required placeholder="0.00" />
			</div>
		</div>

		<!-- Discount -->
		<div class="col-md-4">
			<label class="form-label fw-bold">Discount (%)</label>
			<div class="input-group">
				<input type="number" step="0.01" class="form-control" th:field="*{discountPercent}"
					   min="0" max="100" placeholder="0.00" />
				<span class="input-group-text">%</span>
			</div>
			<div class="form-text text-muted">
				Current discounted price:
				<span class="fw-bold text-success"
					  th:text="${#numbers.formatCurrency(product.discountPrice)}">RM 0.00</span>
			</div>
		</div>
	</div>
</div>
</body>
</html>
