<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="~{fragments :: page_head('Products - Shopme Admin', 'none')}" />
<body
		th:data-cart-add-url="@{/cart/add}"
		th:data-checkout-url="@{/checkout}"
		th:data-csrf-token="${_csrf.token}"
		th:data-csrf-header-name="${_csrf.headerName}">
<div class="container-fluid">
	<div th:replace="~{navigation :: menu}"></div>

	<div>
		<h2>Manage Products</h2>

		<th:block sec:authorize="hasAnyAuthority('Admin', 'Editor')">
			<a th:href="@{/products/new}" class="fas fa-folder-plus fa-2x icon-dark mr-2"></a>
			<a th:href="@{/products/export/csv}" class="fas fa-file-csv fa-2x icon-dark mr-2"></a>
		</th:block>
	</div>

	<div>
		<form th:action="@{/products/page/1}" class="form-inline m-3" id="searchForm">
			<input type="hidden" name="sortField" th:value="${sortField}" />
			<input type="hidden" name="sortDir" th:value="${sortDir}" />

			Category:&nbsp;
			<select class="form-control" name="categoryId" id="dropdownCategory">
				<option value="0">All Categories</option>
				<th:block th:each="cat : ${listCategories}">
					<option th:value="${cat.id}" th:selected="(${categoryId} == ${cat.id})">[[${cat.name}]]</option>
				</th:block>
			</select>

			&nbsp;Filter:&nbsp;
			<input type="search" name="keyword" th:value="${keyword}" class="form-control" required/>
			&nbsp;&nbsp;
			<button type="submit" class="btn btn-primary">
				<i class="fas fa-search"></i>
			</button>
			&nbsp;&nbsp;
			<button type="button" class="btn btn-secondary" onclick="clearFilter()">
				<i class="fas fa-eraser"></i>
			</button>
		</form>

		<div th:if="${message != null}" class="alert alert-success text-center">
			[[${message}]]
		</div>
	</div>

	<div class="full-details">
		<table class="table table-bordered table-striped table-hover table-responsive-xl">
			<thead class="table-dark text-dark">
			<tr>
				<th th:replace="~{fragments :: column_link('id', 'ID', 'tag')}" />
				<th>Main Image</th>
				<th th:replace="~{fragments :: column_link('name', 'Product Name', 'none')}" />
				<th>Brand</th>
				<th>Category</th>
				<th:block sec:authorize="hasAnyAuthority('Admin', 'Editor')">
					<th>Enabled</th>
				</th:block>
				<th></th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="product : ${listProducts}">
				<td class="hideable-column">[[${product.id}]]</td>
				<td>
					<img th:src="@{${product.mainImagePath}}" style="width: 120px" class="img-fluid" />
				</td>
				<td>
					<a class="link-detail"
					   th:href="@{'/products/detail/' + ${product.id}}"
					   th:title="${product.name}"
					>[[${product.shortName}]]</a>
				</td>
				<td class="hideable-column">[[${product.brand.name}]]</td>
				<td class="hideable-column">[[${product.category.name}]]</td>

				<th:block sec:authorize="hasAnyAuthority('Admin', 'Editor')">
					<td>
						<div th:replace="~{fragments :: status(${product.enabled}, 'product', '/products/' + ${product.id})}" />
					</td>
				</th:block>

				<td>
					<!-- Customer actions: only if user has NO staff authority -->
					<div sec:authorize="hasAuthority('Customer')">
						<button type="button" class="btn btn-success btn-sm me-1"
								th:onclick="|addToCart([[${product.id}]])|">
							<i class="fas fa-cart-plus"></i> Add to Cart
						</button>
						<button type="button" class="btn btn-primary btn-sm"
								th:onclick="|buyNow([[${product.id}]])|">
							<i class="fas fa-bolt"></i> Buy Now
						</button>
					</div>

					<!-- Staff actions -->
					<div sec:authorize="hasAnyAuthority('Admin','Editor','Shipper')">
						<!-- Edit for all staff -->
						<a class="fas fa-edit fa-lg text-warning me-2"
						   th:href="@{/products/edit/{id}(id=${product.id})}"
						   title="Edit product"></a>

						<!-- Delete ONLY for Admin/Editor -->
						<a class="fas fa-trash-alt fa-lg text-danger"
							   href="#"
							   data-product-id="${product.id}"
							   data-product-name="${product.name}"
							   onclick="confirmDeleteFromData(this)"
							   title="Delete product"></a>
					</div>
				</td>
			</tr>
			</tbody>
		</table>
	</div>

	<div class="less-details">
		<div th:each="product : ${listProducts}" class="row m-1">
			<div class="col-4">
				<img th:src="@{${product.mainImagePath}}" style="width: 80px" class="img-fluid" />
			</div>
			<div class="col-8">
				<div>
					<a class="link-detail" th:href="@{'/products/detail/' + ${product.id}}">[[${product.shortName}]]</a>
				</div>
				<div class="mt-2">
					<a class="fas fa-file-alt fa-2x icon-green link-detail"
					   th:href="@{'/products/detail/' + ${product.id}}"></a>

					<!-- Customer actions -->
					<div sec:authorize="hasAuthority('Customer')">
						<button type="button" class="btn btn-success btn-sm me-1"
								th:onclick="|addToCart([[${product.id}]])|">
							<i class="fas fa-cart-plus"></i> Add to Cart
						</button>
						<button type="button" class="btn btn-primary btn-sm"
								th:onclick="|buyNow([[${product.id}]])|">
							<i class="fas fa-bolt"></i> Buy Now
						</button>
					</div>

					<!-- Staff actions -->
					<div sec:authorize="hasAnyAuthority('Admin','Editor','Shipper')">
						<div th:replace="~{fragments :: edit('product', '/products/edit/' + ${product.id})}" />
					</div>

					<div sec:authorize="hasAnyAuthority('Admin','Editor')">
						<div th:replace="~{fragments :: delete('product', ${product.id}, '/products/delete/' + ${product.id}, true)}" />
					</div>
				</div>
			</div>
			<div>&nbsp;</div>
		</div>
	</div>

	<div th:replace="~{modal_fragments :: confirm_modal}" />

	<div class="modal fade" id="detailModal">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
			</div>
		</div>
	</div>

	<div th:replace="~{fragments :: pagination('products')}"></div>

	<div th:replace="~{fragments :: footer}"></div>

</div>

<div th:replace="~{fragments :: buyNowModal}"></div>

<div th:replace="~{fragments :: review_modal}"></div>

<script th:inline="javascript">
	const moduleURL = /*[[ @{/products} ]]*/ '/products';
</script>

<script th:src="@{/js/common_list.js}"></script>

<script th:inline="javascript">
	// ===== GLOBAL HELPER =====
	function showToast(message, type = 'success') {
		const toastElement = document.getElementById('cart-toast');
		const toastBody = document.getElementById('toast-message');
		if (!toastElement || !toastBody) return;

		toastBody.textContent = message;
		toastElement.className = `toast align-items-center text-white border-0 ${
				type === 'success' ? 'bg-success' : 'bg-danger'
		}`;

		const toast = new bootstrap.Toast(toastElement, {
			autohide: true,
			delay: 3000
		});
		toast.show();
	}

	// ===== GLOBAL FUNCTION: MUST BE ACCESSIBLE FROM HTML onclick =====
	function addToCart(productId, redirectAfter = false) {
		const body = document.body;
		const cartAddUrl = body.getAttribute('data-cart-add-url');
		const checkoutUrl = body.getAttribute('data-checkout-url');
		const csrfToken = body.getAttribute('data-csrf-token');
		const csrfHeaderName = body.getAttribute('data-csrf-header-name');

		const formData = new FormData();
		formData.append('productId', productId);
		formData.append('quantity', 1);

		fetch(cartAddUrl, {
			method: 'POST',
			headers: {
				[csrfHeaderName]: csrfToken,
				'X-Requested-With': 'XMLHttpRequest'
			},
			body: formData
		})
				.then(response => {
					if (response.ok) {
						if (redirectAfter) {
							window.location.href = checkoutUrl;
						} else {
							showToast('✅ Item added to cart!', 'success');
						}
					} else {
						return response.text().then(text => {
							throw new Error(text.trim() || 'Failed to add to cart');
						});
					}
				})
				.catch(error => {
					console.error('Cart error:', error);
					const safeMsg = (error.message || 'Could not add to cart. Please try again.')
							.replace(/</g, '&lt;')
							.replace(/>/g, '&gt;');
					showToast(`❌ ${safeMsg}`, 'error');
				});
	}

	// ===== Other global functions (already correct) =====
	function buyNow(productId) {
		const modalEl = document.getElementById('buyNowModal');
		modalEl.dataset.productId = productId;
		const modal = new bootstrap.Modal(modalEl);
		modal.show();
	}

	function confirmDeleteFromData(element) {
		const productId = element.getAttribute('data-product-id');
		const productName = element.getAttribute('data-product-name');
		document.getElementById('confirmText').innerText =
				'Are you sure you want to delete product "' + productName + '"?';

		document.getElementById('yesButton').onclick = function () {
			window.location.href = /*[[@{/products/delete/}]]*/ + productId;
		};

		const modal = new bootstrap.Modal(document.getElementById('confirmModal'));
		modal.show();
	}

	// ===== DOM-READY INIT (only for non-global logic) =====
	document.addEventListener('DOMContentLoaded', function () {
		// Attach "Go to Checkout" button listener (uses global addToCart)
		const confirmBtn = document.getElementById('confirmBuyNowBtn');
		if (confirmBtn) {
			confirmBtn.addEventListener('click', function () {
				const modalEl = document.getElementById('buyNowModal');
				const productId = modalEl.dataset.productId;
				if (productId) {
					addToCart(productId, true); // ✅ Now calls global function
					const modal = bootstrap.Modal.getInstance(modalEl);
					if (modal) modal.hide();
				}
			});
		}
	});
</script>
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
	<div id="cart-toast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive" aria-atomic="true">
		<div class="d-flex">
			<div class="toast-body" id="toast-message"></div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
		</div>
	</div>
</div>
</body>
</html>
