<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: page_head('Edit Shipping Rate - Admin', 'none')}" />
<body>
<div class="container-fluid">
    <div th:replace="~{navigation :: menu}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-edit me-2"></i> Edit Shipping Rate</h2>
            <a th:href="@{/shipping-rates}" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left"></i> Back to Rates
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:object="${shippingRate}"
                      th:action="@{/shipping-rates/update/{id}(id=${shippingRate.id})}"
                      method="post">

                    <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
                        <ul>
                            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                        </ul>
                    </div>

                    <!-- COUNTRY -->
                    <div class="mb-3">
                        <label class="form-label">Country *</label>
                        <select class="form-select" th:field="*{country.id}" required>
                            <option value="">── Select Country ──</option>
                            <option th:each="c : ${countries}"
                                    th:value="${c.id}"
                                    th:text="${c.name + ' (' + c.code + ')'}">
                            </option>
                        </select>
                    </div>

                    <!-- RATE -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Shipping Rate (USD) *</label>
                            <input type="number" step="0.01" min="0" class="form-control"
                                   th:field="*{rate}" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Delivery Days *</label>
                            <input type="number" min="0" max="30" class="form-control"
                                   th:field="*{days}" required />
                        </div>
                    </div>

                    <!-- COD -->
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" th:field="*{codSupported}" id="codSupported" />
                        <label class="form-check-label" for="codSupported">Cash on Delivery Supported</label>
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Update Rate
                    </button>
                    <a th:href="@{/shipping-rates}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
