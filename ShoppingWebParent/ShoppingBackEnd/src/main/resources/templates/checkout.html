<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="~{fragments :: page_head('Checkout - Shopme', 'none')}" />
<body>
<div class="container-fluid">
    <div th:replace="~{navigation :: menu}"></div>

    <div class="container mt-4">
        <h2>Checkout</h2>

        <div th:if="${error}" class="alert alert-danger">
            <span th:text="${error}">Error</span>
        </div>

        <form th:object="${orderRequest}" th:action="@{/checkout}" method="post">
            <!-- Shipping Address -->
            <div class="card mb-4">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">📦 Shipping Address</h4>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(addresses)}" class="alert alert-warning">
                        <i class="fas fa-exclamation-triangle"></i>
                        You have no saved addresses. Please add one in your profile.
                    </div>

                    <div th:unless="${#lists.isEmpty(addresses)}">
                        <select th:field="*{addressId}" class="form-select form-select-lg" required>
                            <option value="">── Select an address ──</option>
                            <option th:each="addr : ${addresses}"
                                    th:value="${addr.id}"
                                    th:text="${addr.fullName + ' - ' + addr.addressLine1 + ', ' + addr.city}">
                                Address
                            </option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Cart Summary -->
            <div class="card mb-4">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">📋 Order Summary</h4>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>Product</th>
                            <th class="text-center">Quantity</th>
                            <th class="text-end">Total</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${cartItems}">
                            <td>
                                <strong th:text="${item.product.name}">Product</strong>
                            </td>
                            <td class="text-center" th:text="${item.quantity}">Qty</td>
                            <td class="text-end fw-bold"
                                th:text="${#numbers.formatCurrency(item.product.price * item.quantity)}">
                                $0.00
                            </td>
                        </tr>
                        <tr class="table-light">
                            <td>
                                <strong>Total</strong>
                            </td>
                            <td class="text-center" th:text="${totalQuantity}">0</td>
                            <td class="text-end fw-bold"
                                  th:text="${#numbers.formatCurrency(cartTotal)}">
                                        $0.00
                                    </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Payment Method -->
            <div class="card mb-4">
                <div class="card-header bg-info text-white">
                    <h4 class="mb-0">💳 Payment Method</h4>
                </div>
                <div class="card-body">
                    <select th:field="*{paymentMethod}" class="form-select form-select-lg" required>
                        <option value="">── Select payment method ──</option>
                        <option value="CASH_ON_DELIVERY">💵 Cash on Delivery</option>
                        <option value="CASH_ON_DELIVERY">💳 Online Banking</option>
                    </select>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-3">
                <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                    <i class="fas fa-shopping-cart"></i> Place Order
                </button>
                <a th:href="@{/cart}" class="btn btn-secondary btn-lg">
                    <i class="fas fa-arrow-left"></i> Back to Cart
                </a>
            </div>
        </form>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
