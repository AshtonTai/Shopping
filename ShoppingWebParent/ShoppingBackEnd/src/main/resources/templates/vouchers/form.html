<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: page_head('Voucher Form - Admin', 'none')}" />
<body>
<div class="container-fluid">
    <div th:replace="~{navigation :: menu}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-ticket-alt me-2"></i>
                <span th:if="${voucher.id == null}">Create Voucher</span>
                <span th:unless="${voucher.id == null}">Edit Voucher</span>
            </h2>
            <a th:href="@{/admin/vouchers}" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-1"></i> Back to List
            </a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:object="${voucher}" th:action="@{/admin/vouchers/save}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Voucher Code *</label>
                            <input type="text" class="form-control" th:field="*{code}" required maxlength="20" />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type *</label>
                            <select class="form-select" th:field="*{type}" required>
                                <option th:each="type : ${voucherTypes}"
                                        th:value="${type}"
                                        th:text="${type}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Value *</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{value}" required />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Description</label>
                            <input type="text" class="form-control" th:field="*{description}" maxlength="255" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Valid From</label>
                            <input type="datetime-local" class="form-control" th:field="*{validFrom}" />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Valid Until</label>
                            <input type="datetime-local" class="form-control" th:field="*{validUntil}" />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Usage Limit</label>
                            <input type="number" class="form-control" th:field="*{usageLimit}"
                                   placeholder="Leave blank for unlimited" min="1" />
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" th:field="*{active}" id="active" />
                                <label class="form-check-label" for="active">Active</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" th:field="*{singleUsePerCustomer}" id="singleUse" />
                                <label class="form-check-label" for="singleUse">Single use per customer</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save me-1"></i> Save Voucher
                    </button>
                    <a th:href="@{/admin/vouchers}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
    <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
