<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="~{fragments :: page_head('States - Admin', 'none')}"></head>
<body>
<div class="container-fluid">
    <div th:replace="~{navigation :: menu}"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🚩 States / Provinces</h2>
            <a th:href="@{/admin/states/new}" class="btn btn-primary">
                <i class="fas fa-plus"></i> Add State
            </a>
        </div>

        <div th:if="${#lists.isEmpty(states)}" class="alert alert-info">
            No states configured yet.
        </div>

        <table class="table table-hover" th:unless="${#lists.isEmpty(states)}">
            <thead class="table-light">
            <tr>
                <th>ID</th>
                <th>State Name</th>
                <th>Country</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="s : ${states}">
                <td th:text="${s.id}">1</td>
                <td th:text="${s.name}">Selangor</td>
                <td th:text="${s.country.name}">Malaysia</td>
                <td>
                    <a th:href="@{/admin/states/edit/{id}(id=${s.id})}"
                       class="btn btn-sm btn-outline-primary me-1">
                        <i class="fas fa-edit"></i> Edit
                    </a>
                    <form th:action="@{/admin/states/delete/{id}(id=${s.id})}"
                          method="post" style="display:inline;"
                          onsubmit="return confirm('Delete this state?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
