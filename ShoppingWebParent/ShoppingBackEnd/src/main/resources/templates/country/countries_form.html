<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:replace="~{fragments :: page_head('Country Form - Admin', 'none')}"></head>
<body>
<div class="container-fluid">
    <div th:replace="~{navigation :: menu}"></div>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${country.id != null ? 'Edit Country' : 'Add New Country'}">
                    Add New Country
                </h4>
            </div>
            <div class="card-body">
                <form th:object="${country}" th:action="@{/admin/countries/save}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="name" class="form-label">Country Name *</label>
                        <input type="text" class="form-control" id="name"
                               th:field="*{name}" required maxlength="64" />
                    </div>

                    <div class="mb-3">
                        <label for="code" class="form-label">Country Code (ISO 2-letter) *</label>
                        <input type="text" class="form-control" id="code"
                               th:field="*{code}" required maxlength="2"
                               placeholder="e.g., SG, MY, US" />
                    </div>

                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-save"></i> Save Country
                    </button>
                    <a th:href="@{/admin/countries}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
</div>
</body>
</html>
