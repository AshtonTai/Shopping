<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: page_head('My Orders - Shopme', 'none')}" />
<body>
<div class="container-fluid">
	<div th:replace="~{navigation :: menu}"></div>

	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fas fa-box me-2"></i> My Orders</h2>
		</div>

		<!-- Flash messages -->
		<div th:if="${message}" class="alert alert-success">
			<i class="fas fa-check-circle"></i> <span th:text="${message}">Success</span>
		</div>
		<div th:if="${error}" class="alert alert-danger">
			<i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error</span>
		</div>

		<!-- Orders List -->
		<div th:if="${#lists.isEmpty(listOrders)}" class="text-center py-5">
			<i class="fas fa-box-open text-muted" style="font-size: 4rem;"></i>
			<h4 class="mt-3">No orders yet</h4>
			<p class="text-muted">Your orders will appear here once you place them.</p>
			<a th:href="@{/products}" class="btn btn-primary">Start Shopping</a>
		</div>

		<div class="row" th:unless="${#lists.isEmpty(listOrders)}">
			<div class="col-12">
				<div class="table-responsive">
					<table class="table table-hover align-middle">
						<thead class="table-light">
						<tr>
							<th>Order #</th>
							<th>Date</th>
							<th>Items</th>
							<th>Total</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="order : ${listOrders}">
							<td>
								<a th:href="@{'/orders/detail/' + ${order.id}}"
								   class="text-decoration-none fw-bold text-primary">
									#[[${order.id}]]
								</a>
							</td>
							<td>
								<div th:replace="~{fragments :: format_time(${order.orderTime})}"></div>
							</td>
							<td>
								<span class="badge bg-secondary" th:text="${order.orderDetails.size()} + ' items'">3 items</span>
							</td>
							<td>
								<div th:replace="~{fragments :: format_currency(${order.totalAmount})}"></div>
							</td>
							<td>
								<span class="badge"
									  th:classappend="${order.status == 'DELIVERED' ? 'bg-success' :
									                 order.status == 'SHIPPED' ? 'bg-info' :
									                 order.status == 'CONFIRMED' ? 'bg-warning' : 'bg-secondary'}"
									  th:text="${order.status}">
									Status
								</span>
							</td>
							<td>
								<a th:href="@{'/orders/detail/' + ${order.id}}"
								   class="btn btn-sm btn-outline-primary me-2"
								   title="View details">
									<i class="fas fa-eye"></i>
								</a>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div th:if="${!#lists.isEmpty(listOrders)}" th:replace="~{fragments :: pagination('orders')}"></div>
	</div>

	<div th:replace="~{fragments :: footer}"></div>
</div>

<!-- Modals -->
<div th:replace="~{modal_fragments :: confirm_modal}"></div>
<div class="modal fade" id="orderDetailModal">
	<div class="modal-dialog modal-xl">
		<div class="modal-content"></div>
	</div>
</div>

<script th:src="@{/js/common_list.js}"></script>
<script th:inline="javascript">
	const moduleURL = /*[[ @{/orders} ]]*/ '/orders';

	document.addEventListener('DOMContentLoaded', function() {
		// Handle order detail modal
		document.querySelectorAll('.btn-outline-primary').forEach(btn => {
			btn.addEventListener('click', function(e) {
				e.preventDefault();
				const url = this.getAttribute('href');
				fetch(url)
						.then(response => response.text())
						.then(html => {
							document.querySelector('#orderDetailModal .modal-content').innerHTML = html;
							new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
						});
			});
		});
	});
</script>

<!-- WebSocket Implementation -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
	<div id="websocket-toast" class="toast align-items-center text-white border-0" role="alert">
		<div class="d-flex">
			<div class="toast-body" id="websocket-message"></div>
			<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
	function connectCustomerWebSocket() {
		const socket = new SockJS(/*[[@{/order-updates}]]*/ '/order-updates');
		const stompClient = Stomp.over(socket);

		stompClient.connect({}, function(frame) {
			stompClient.subscribe('/topic/orders', function(message) {
				const event = JSON.parse(message.body);
				const currentCustomerId = /*[[${#authentication.principal.id}]]*/ null;

				if (event.customerId === currentCustomerId) {
					showToast('Your order #' + event.orderNumber + ' status updated to: ' + event.status, 'info');
					if (event.eventType === 'DELIVERED') {
						setTimeout(() => location.reload(), 3000);
					}
				}
			});
		});
	}

	function showToast(message, type = 'info') {
		const toastElement = document.getElementById('websocket-toast');
		const toastBody = document.getElementById('websocket-message');

		if (!toastElement || !toastBody) return;

		const safeMsg = String(message).replace(/</g, '&lt;').replace(/>/g, '&gt;');
		toastBody.innerHTML = safeMsg;
		toastElement.className = `toast align-items-center text-white border-0 bg-${type === 'success' ? 'success' : type === 'error' ? 'danger' : 'info'}`;

		const toast = new bootstrap.Toast(toastElement, { autohide: true, delay: 5000 });
		toast.show();
	}

	document.addEventListener('DOMContentLoaded', connectCustomerWebSocket);
</script>
</body>
</html>
