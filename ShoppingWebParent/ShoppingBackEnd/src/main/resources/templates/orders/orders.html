<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: page_head('My Orders - Shopme', 'none')}" />
<body>
<div class="container-fluid">
	<div th:replace="~{navigation :: menu}"></div>

	<div class="container mt-4">
		<div class="d-flex justify-content-between align-items-center mb-4">
			<h2><i class="fas fa-box me-2"></i> My Orders</h2>
		</div>

		<!-- Flash messages -->
		<div th:if="${message}" class="alert alert-success">
			<i class="fas fa-check-circle"></i> <span th:text="${message}">Success</span>
		</div>
		<div th:if="${error}" class="alert alert-danger">
			<i class="fas fa-exclamation-triangle"></i> <span th:text="${error}">Error</span>
		</div>

		<!-- Orders List -->
		<div th:if="${#lists.isEmpty(listOrders)}" class="text-center py-5">
			<i class="fas fa-box-open text-muted" style="font-size: 4rem;"></i>
			<h4 class="mt-3">No orders yet</h4>
			<p class="text-muted">Your orders will appear here once you place them.</p>
			<a th:href="@{/products}" class="btn btn-primary">Start Shopping</a>
		</div>

		<div class="row" th:unless="${#lists.isEmpty(listOrders)}">
			<div class="col-12">
				<div class="table-responsive">
					<table class="table table-hover align-middle">
						<thead class="table-light">
						<tr>
							<th>Order #</th>
							<th>Date</th>
							<th>Items</th>
							<th>Total</th>
							<th>Status</th>
							<th>Actions</th>
						</tr>
						</thead>
						<tbody>
						<tr th:each="order : ${listOrders}">
							<td>
								<a th:href="@{'/orders/detail/' + ${order.id}}"
								   class="text-decoration-none fw-bold text-primary">
									#[[${order.id}]]
								</a>
							</td>
							<td>
								<div th:replace="~{fragments :: format_time(${order.orderTime})}"></div>
							</td>
							<td>
								<span class="badge bg-secondary" th:text="${order.orderDetails.size()} + ' items'">3 items</span>
							</td>
							<td>
								<div th:replace="~{fragments :: format_currency(${order.totalAmount})}"></div>
							<td>
                                    <span class="badge"
										  th:classappend="${order.status == 'DELIVERED' ? 'bg-success' :
                         					order.status == 'SHIPPED' ? 'bg-info' :
                         					order.status == 'CONFIRMED' ? 'bg-warning' : 'bg-secondary'}"
										  th:text="${order.status}">
        										Status
    								</span>
							</td>
							<td>
								<a th:href="@{'/orders/detail/' + ${order.id}}"
								   class="btn btn-sm btn-outline-primary me-2"
								   title="View details">
									<i class="fas fa-eye"></i>
								</a>
							</td>
						</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<div th:if="${!#lists.isEmpty(listOrders)}" th:replace="~{fragments :: pagination('orders')}"></div>
	</div>

	<div th:replace="~{fragments :: footer}"></div>
</div>

<!-- Modals -->
<div th:replace="~{modal_fragments :: confirm_modal}"></div>
<div class="modal fade" id="orderDetailModal">
	<div class="modal-dialog modal-xl">
		<div class="modal-content"></div>
	</div>
</div>

<script th:src="@{/js/common_list.js}"></script>
<script th:inline="javascript">
	const moduleURL = /*[[ @{/orders} ]]*/ '/orders';

	document.addEventListener('DOMContentLoaded', function() {
		// Handle order detail modal
		document.querySelectorAll('.btn-outline-primary').forEach(btn => {
			btn.addEventListener('click', function(e) {
				e.preventDefault();
				const url = this.getAttribute('href');
				fetch(url)
						.then(response => response.text())
						.then(html => {
							document.querySelector('#orderDetailModal .modal-content').innerHTML = html;
							new bootstrap.Modal(document.getElementById('orderDetailModal')).show();
						});
			});
		});
	});
</script>
</body>
</html>
